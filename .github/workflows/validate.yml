name: Build and Test

on:
  push:
    branches: [ main, part2-api, part3-mvc ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore RaceDayAPI.sln
    
    - name: Build API and MVC
      run: dotnet build RaceDayAPI.sln --no-restore --configuration Release
    
    - name: Run unit tests
      run: dotnet test RaceDayAPI.sln --no-build --configuration Release --verbosity normal
    
    - name: Verify Dockerfile exists
      run: |
        if [ ! -f "Dockerfile" ]; then
          echo "❌ Dockerfile missing"
          exit 1
        fi
        echo "✅ Dockerfile present"
    
    - name: Build Docker image
      run: docker build -t racedaymvc:ci .
    
    - name: Final validation
      run: echo "✅ Build, tests, and Docker all passed"
