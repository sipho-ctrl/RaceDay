name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check docs folder exists
      run: |
        if [ -d "docs" ]; then
          echo "✅ docs folder exists"
        else
          echo "❌ docs folder missing"
          exit 1
        fi
    
    - name: Check ERD.pdf exists
      run: |
        if [ -f "docs/ERD.pdf" ]; then
          echo "✅ ERD.pdf exists"
        else
          echo "❌ ERD.pdf missing"
          exit 1
        fi
    
    - name: Check APIEndpointPlan.pdf exists
      run: |
        if [ -f "docs/APIEndpointPlan.pdf" ]; then
          echo "✅ APIEndpointPlan.pdf exists"
        else
          echo "❌ APIEndpointPlan.pdf missing"
          exit 1
        fi
    
    - name: Check RaceDayDatabase.sql exists
      run: |
        if [ -f "docs/RaceDayDatabase.sql" ]; then
          echo "✅ RaceDayDatabase.sql exists"
        else
          echo "❌ RaceDayDatabase.sql missing"
          exit 1
        fi
    
    - name: Check README.md exists
      run: |
        if [ -f "README.md" ]; then
          echo "✅ README.md exists"
        else
          echo "❌ README.md missing"
          exit 1
        fi
    
    - name: Final validation
      run: echo "✅ All required files present - Repository structure is valid!"